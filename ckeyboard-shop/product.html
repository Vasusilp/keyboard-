<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สินค้าทั้งหมด — Ckeyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="nav wrap">
    <a href="index.html" class="logo">C<span>key</span>board</a>
    <div class="nav-links">
      <a href="index.html">หน้าแรก</a>
      <a href="#" class="filter-jump" data-filter="mechanical">Mechanical</a>
      <a href="#" class="filter-jump" data-filter="magnetic">Magnetic</a>
      <a href="#" class="filter-jump" data-filter="switches">Switches</a>
    </div>
    <a href="index.html" class="nav-cta">หน้าแรก</a>
  </nav>
</header>

<div class="page-title wrap">
  <h1>สินค้าทั้งหมด</h1>
  <p>คีย์บอร์ดเกมมิ่งและสวิตช์ 8 รุ่น — กรองตามหมวดที่ใช่สำหรับคุณ</p>
</div>

<section class="products">
  <div class="wrap">
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">ทั้งหมด</button>
      <button class="filter-tab" data-filter="mechanical">Mechanical</button>
      <button class="filter-tab" data-filter="magnetic">Magnetic</button>
      <button class="filter-tab" data-filter="switches">Switches</button>
    </div>

    <div class="product-grid" id="productGrid">
      <!-- rendered by script.js from products.json -->
    </div>
  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <div>© <span id="year"></span> Ckeyboard. All rights reserved.</div>
    <div class="legend">
      <span><span class="dot cyan"></span>Mechanical</span>
      <span><span class="dot magenta"></span>Magnetic</span>
      <span><span class="dot green"></span>Switches</span>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script>
  // allow header links (#mechanical etc, or ?hash from index.html) to trigger the matching filter tab
  document.addEventListener("DOMContentLoaded", () => {
    const applyHashFilter = () => {
      const hash = window.location.hash.replace("#", "");
      if (!hash) return;
      const tab = document.querySelector(`#filterTabs .filter-tab[data-filter="${hash}"]`);
      if (tab) tab.click();
    };
    setTimeout(applyHashFilter, 50); // wait for products to render first
    document.querySelectorAll(".filter-jump").forEach(link => {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        const tab = document.querySelector(`#filterTabs .filter-tab[data-filter="${link.dataset.filter}"]`);
        if (tab) tab.click();
        document.getElementById("productGrid").scrollIntoView({ behavior: "smooth" });
      });
    });
  });
</script>
</body>
</html>
