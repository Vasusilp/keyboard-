<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สั่งซื้อ — Ckeyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="nav wrap">
    <a href="index.html" class="logo">C<span>key</span>board</a>
    <div class="nav-links">
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">สินค้าทั้งหมด</a>
    </div>
    <a href="product.html" class="nav-cta">เลือกสินค้าอื่น</a>
  </nav>
</header>

<div class="page-title wrap">
  <h1>ยืนยันคำสั่งซื้อ</h1>
  <p>กรอกข้อมูลให้ครบ แล้วเราจะติดต่อกลับเพื่อยืนยันการชำระเงินและจัดส่ง</p>
</div>

<section class="form-section">
  <div class="order-layout">
    <form class="form-card" id="orderForm">
      <div class="field">
        <label for="itemName">สินค้า</label>
        <input type="text" id="itemName" readonly>
      </div>
      <div class="field">
        <label for="itemPrice">ราคา</label>
        <input type="text" id="itemPrice" readonly>
      </div>
      <div class="field">
        <label for="customerName">ชื่อ-นามสกุล</label>
        <input type="text" id="customerName" placeholder="ชื่อผู้สั่งซื้อ" required>
      </div>
      <div class="field">
        <label for="customerContact">เบอร์โทร / LINE ID</label>
        <input type="text" id="customerContact" placeholder="สำหรับติดต่อกลับ" required>
      </div>
      <div class="field">
        <label for="orderNote">หมายเหตุ (ถ้ามี)</label>
        <textarea id="orderNote" placeholder="เช่น สีที่ต้องการ / ที่อยู่จัดส่ง"></textarea>
      </div>
      <button type="submit" class="btn-primary" style="width:100%">ยืนยันสั่งซื้อ</button>
      <div class="form-status" id="formStatus"></div>
    </form>

    <div class="summary-card">
      <h3>สรุปคำสั่งซื้อ</h3>
      <div class="summary-row"><span id="summaryItem">-</span></div>
      <div class="summary-total"><span>ยอดรวม</span><span id="orderTotal">-</span></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <div>© <span id="year"></span> Ckeyboard. All rights reserved.</div>
  </div>
</footer>

<script src="script.js"></script>
<script>
  // mirror the selected item name into the summary card
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const item = params.get("item");
    const summaryItem = document.getElementById("summaryItem");
    if (summaryItem) summaryItem.textContent = item || "ยังไม่ได้เลือกสินค้า";
  });
</script>
</body>
</html>
